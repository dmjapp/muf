<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - DMJ Executive Portal</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #0a1d56;
            --secondary: #1e3a8a;
            --accent: #f59e0b;
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #334155;
            --text-light: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { background-color: var(--bg-body); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background-color: var(--primary);
            color: white;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 10px rgba(0,0,0,0.1);
        }

        .sidebar-header { padding: 20px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-header img { width: 120px; margin-bottom: 10px; background: white; padding: 5px; border-radius: 8px;}
        .sidebar-header h3 { font-size: 1.1rem; color: var(--accent); }

        .menu { flex: 1; padding: 20px 0; overflow-y: auto; }
        .menu-item {
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            color: #cbd5e1;
            text-decoration: none;
            transition: all 0.3s;
            cursor: pointer;
        }
        .menu-item:hover, .menu-item.active { background-color: var(--secondary); color: white; border-left: 4px solid var(--accent); }
        .menu-item i { width: 20px; text-align: center; }

        .user-info { padding: 20px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; }
        .user-info span { display: block; color: var(--accent); font-weight: bold; margin-bottom: 10px;}
        .btn-logout {
            width: 100%; padding: 10px; background: #dc2626; color: white; border: none; border-radius: 6px; cursor: pointer; transition: 0.3s;
        }
        .btn-logout:hover { background: #b91c1c; }

        /* Main Content */
        .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        
        .topbar { background: white; padding: 20px 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; }
        .topbar h2 { color: var(--primary); }

        .content-area { padding: 30px; }
        
        .card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .card-header { border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; margin-bottom: 20px; color: var(--primary); }
        
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--text-light); }
        .form-group input {
            width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; font-size: 1rem;
        }
        .form-group input:focus { border-color: var(--primary); }
        .form-group input:disabled { background-color: #e2e8f0; cursor: not-allowed; color: #94a3b8; }

        .btn-save {
            background: #10b981; color: white; border: none; padding: 12px 30px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s;
        }
        .btn-save:hover { background: #059669; }

        /* Loader Overlay */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader">
        <div class="spinner"></div>
        <h3 style="margin-top: 15px; color: #0a1d56;">Memeriksa Kredensial & Akses...</h3>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <img src="logo.png" alt="DMJ Logo" onerror="this.style.display='none'">
            <h3>EXECUTIVE PORTAL</h3>
        </div>
        
        <div class="menu">
            <div class="menu-item active"><i class="fas fa-edit"></i> Input Harian</div>
            <div class="menu-item" id="menu-excel" style="display:none;"><i class="fas fa-file-excel"></i> Upload Excel</div>
            <div class="menu-item" id="menu-users" style="display:none;"><i class="fas fa-users"></i> Kelola User</div>
        </div>

        <div class="user-info">
            Login sebagai:<br>
            <span id="user-display-name">Memuat...</span>
            <span id="user-role-badge" style="color: #cbd5e1; font-weight: normal; font-size: 0.8rem;">Role: -</span>
            <button class="btn-logout" id="btn-logout"><i class="fas fa-sign-out-alt"></i> Keluar</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="topbar">
            <h2><i class="fas fa-calendar-alt"></i> Data Harian: <span id="tanggal-hari-ini"></span></h2>
            <div id="status-simpan" style="color: #10b981; font-weight: bold; display: none;"><i class="fas fa-check-circle"></i> Tersimpan!</div>
        </div>

        <div class="content-area">
            <div class="card">
                <h3 class="card-header"><i class="fas fa-chart-line"></i> Form Input Portofolio (Miliar)</h3>
                <form id="form-harian">
                    
                    <!-- Kotak Eksekutif (Hanya Super Admin) -->
                    <div id="area-eksekutif" style="display: none; background: #f8fafc; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #e2e8f0;">
                        <h4 style="margin-bottom: 15px; color: var(--accent);"><i class="fas fa-crown"></i> Kontrol Khusus Pimpinan</h4>
                        <div class="form-grid">
                            <div class="form-group">
                                <label>Target Global YTD</label>
                                <input type="number" id="input-target" placeholder="Contoh: 1500" step="any">
                            </div>
                            <div class="form-group">
                                <label>Captive Rate (%)</label>
                                <input type="number" id="input-captive" placeholder="Contoh: 45.5" step="any">
                            </div>
                        </div>
                    </div>

                    <!-- Kotak Portofolio -->
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Pencapaian NCAR</label>
                            <input type="number" id="input-ncar" data-porto="NCAR" placeholder="0" step="any">
                        </div>
                        <div class="form-group">
                            <label>Pencapaian CCAR</label>
                            <input type="number" id="input-ccar" data-porto="CCAR" placeholder="0" step="any">
                        </div>
                        <div class="form-group">
                            <label>Pencapaian NMCY</label>
                            <input type="number" id="input-nmcy" data-porto="NMCY" placeholder="0" step="any">
                        </div>
                        <div class="form-group">
                            <label>Pencapaian USECAR</label>
                            <input type="number" id="input-usecar" data-porto="USECAR" placeholder="0" step="any">
                        </div>
                    </div>

                    <div style="margin-top: 20px; text-align: right;">
                        <button type="submit" class="btn-save"><i class="fas fa-save"></i> UPDATE DASHBOARD</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        
        // Konfigurasi Database (Sama seperti login)
        const firebaseConfig = {
            apiKey: "AIzaSyB6wb8YS-LRnDk7h5UFGTwOR26wpCtxEW4",
            authDomain: "dmj-muf.firebaseapp.com",
            projectId: "dmj-muf",
            storageBucket: "dmj-muf.firebasestorage.app",
            messagingSenderId: "151482891980",
            appId: "1:151482891980:web:2b69494a0e6ced5deecc69"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Setup Tanggal Hari Ini untuk Document ID (Format: YYYY-MM-DD)
        const today = new Date();
        const yyyy = today.getFullYear();
        let mm = today.getMonth() + 1;
        let dd = today.getDate();
        if (dd < 10) dd = '0' + dd;
        if (mm < 10) mm = '0' + mm;
        const documentIdHarian = `${yyyy}-${mm}-${dd}`;
        
        document.getElementById('tanggal-hari-ini').innerText = `${dd}-${mm}-${yyyy}`;

        // Cek Sesi Login
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // User sudah login, ambil hak aksesnya dari koleksi 'users'
                const userEmail = user.email;
                const userDocRef = doc(db, "users", userEmail);
                const userDocSnap = await getDoc(userDocRef);

                if (userDocSnap.exists()) {
                    const userData = userDocSnap.data();
                    terapkanHakAkses(userData);
                    muatDataHarian();
                } else {
                    alert("Akun Anda tidak terdaftar di sistem hak akses! Hubungi Kepala Cabang.");
                    keluar();
                }
            } else {
                // Jika belum login, tendang kembali ke login.html
                window.location.href = 'login.html';
            }
        });

        // Fungsi Mengatur Hak Akses Sesuai Role
        function terapkanHakAkses(userData) {
            document.getElementById('user-display-name').innerText = userData.nama;
            document.getElementById('user-role-badge').innerText = `Akses: ${userData.portofolio.toUpperCase()}`;

            const inputs = document.querySelectorAll('input[data-porto]');
            
            if (userData.role === 'superadmin' || userData.portofolio === 'all') {
                // KEPALA CABANG / ADMIN: Buka Semua Fitur
                document.getElementById('area-eksekutif').style.display = 'block';
                document.getElementById('menu-excel').style.display = 'flex';
                document.getElementById('menu-users').style.display = 'flex';
            } else {
                // PIC: Kunci semua input, KECUALI portofolio miliknya
                inputs.forEach(input => {
                    if (input.getAttribute('data-porto') !== userData.portofolio) {
                        input.disabled = true;
                    }
                });
            }

            // Sembunyikan layar loading
            document.getElementById('loader').style.display = 'none';
        }

        // Fungsi Menarik Data Hari Ini dari Database
        async function muatDataHarian() {
            const harianRef = doc(db, "laporan_harian", documentIdHarian);
            const harianSnap = await getDoc(harianRef);

            if (harianSnap.exists()) {
                const data = harianSnap.data();
                if(data.target) document.getElementById('input-target').value = data.target;
                if(data.captive) document.getElementById('input-captive').value = data.captive;
                if(data.NCAR) document.getElementById('input-ncar').value = data.NCAR;
                if(data.CCAR) document.getElementById('input-ccar').value = data.CCAR;
                if(data.NMCY) document.getElementById('input-nmcy').value = data.NMCY;
                if(data.USECAR) document.getElementById('input-usecar').value = data.USECAR;
            }
        }

        // Fungsi Simpan (Update Data)
        document.getElementById('form-harian').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Siapkan paket data yang akan di-update
            const dataUpdate = {};
            
            const target = document.getElementById('input-target').value;
            const captive = document.getElementById('input-captive').value;
            const ncar = document.getElementById('input-ncar').value;
            const ccar = document.getElementById('input-ccar').value;
            const nmcy = document.getElementById('input-nmcy').value;
            const usecar = document.getElementById('input-usecar').value;

            // Hanya update kolom yang tidak di-disabled (terkunci)
            if(!document.getElementById('input-target').disabled && target) dataUpdate.target = Number(target);
            if(!document.getElementById('input-captive').disabled && captive) dataUpdate.captive = Number(captive);
            if(!document.getElementById('input-ncar').disabled && ncar) dataUpdate.NCAR = Number(ncar);
            if(!document.getElementById('input-ccar').disabled && ccar) dataUpdate.CCAR = Number(ccar);
            if(!document.getElementById('input-nmcy').disabled && nmcy) dataUpdate.NMCY = Number(nmcy);
            if(!document.getElementById('input-usecar').disabled && usecar) dataUpdate.USECAR = Number(usecar);

            try {
                // Simpan ke Firestore (merge: true agar tidak menghapus data yang sudah diinput PIC lain)
                await setDoc(doc(db, "laporan_harian", documentIdHarian), dataUpdate, { merge: true });
                
                // Animasi Berhasil
                const status = document.getElementById('status-simpan');
                status.style.display = 'block';
                setTimeout(() => { status.style.display = 'none'; }, 3000);
            } catch (error) {
                console.error("Gagal menyimpan data:", error);
                alert("Gagal menyimpan data ke server.");
            }
        });

        // Fitur Logout
        function keluar() {
            signOut(auth).then(() => {
                window.location.href = 'login.html';
            });
        }
        document.getElementById('btn-logout').addEventListener('click', keluar);

    </script>
</body>
</html>
