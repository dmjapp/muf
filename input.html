<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Input Cabang Banda Aceh</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f3f4f6; padding: 20px; display: flex; justify-content: center; }
        .form-container { background-color: #ffffff; width: 100%; max-width: 600px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-top: 8px solid #0a1d56; padding: 30px; }
        .header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .header h1 { color: #0a1d56; font-size: 22px; margin-bottom: 5px; }
        .header p { color: #666; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: bold; color: #333; margin-bottom: 8px; font-size: 14px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: #0a1d56; }
        .section-title { background-color: #f59e0b; color: #0a1d56; font-weight: bold; padding: 8px 12px; border-radius: 4px; font-size: 14px; margin: 25px 0 15px 0; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-submit { background-color: #0a1d56; color: white; border: none; padding: 15px; width: 100%; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 20px; }
        .btn-submit:hover { background-color: #1e3a8a; }
        .alert-success { background-color: #d1fae5; color: #065f46; padding: 15px; border-radius: 4px; border: 1px solid #34d399; text-align: center; font-weight: bold; margin-top: 20px; display: none; }
    </style>
</head>
<body>

<div class="form-container">
    <div class="header">
        <h1>FORM UPDATE HARIAN</h1>
        <p>Cabang Banda Aceh</p>
    </div>

    <form id="formInputAdmin">
        <div class="form-group">
            <label><i class="far fa-calendar-alt" style="color: #0a1d56;"></i> Tanggal Data:</label>
            <input type="date" id="tanggal" required>
        </div>

        <div class="form-group">
            <label><i class="fas fa-bullseye" style="color: #f59e0b;"></i> Target Amount Cabang:</label>
            <input type="number" id="target_amount" placeholder="Contoh: 25889" value="25889" required>
            <small style="color: #666; font-size: 11px;">Masukkan angka tanpa titik/koma (misal: 25889 untuk 25,889 M).</small>
        </div>

        <div class="section-title"><i class="fas fa-car"></i> 1. BOOKING BY PORTOFOLIO (Kumulatif)</div>
        <p style="font-size: 11px; color: #666; margin-bottom: 15px;">*Masukkan total angka tanpa koma/titik (misal: 37249 untuk 37,249 M).</p>
        
        <div class="grid-2">
            <div class="form-group"><label>CCAR</label><input type="number" id="ccar" placeholder="0" value="0" required></div>
            <div class="form-group"><label>NCAR</label><input type="number" id="ncar" placeholder="0" value="0" required></div>
            <div class="form-group"><label>CBSICAR</label><input type="number" id="cbsicar" placeholder="0" value="0" required></div>
            <div class="form-group"><label>NMCY</label><input type="number" id="nmcy" placeholder="0" value="0" required></div>
            <div class="form-group"><label>MCAR</label><input type="number" id="mcar" placeholder="0" value="0" required></div>
            <div class="form-group"><label>Lainnya</label><input type="number" id="lainnya" placeholder="0" value="0" required></div>
        </div>

        <div class="section-title"><i class="fas fa-chart-line"></i> 2. INDIKATOR KINERJA CABANG</div>
        
        <div class="grid-2">
            <div class="form-group"><label>Captive Rate (%)</label><input type="number" step="0.01" id="captive" placeholder="0" value="0" required></div>
            <div class="form-group"><label>WALR (%)</label><input type="number" step="0.01" id="walr" placeholder="0" value="0" required></div>
            <div class="form-group"><label>PO + FDE</label><input type="number" id="pofde" placeholder="0" value="0" required></div>
            <div class="form-group"><label>IA</label><input type="number" id="ia" placeholder="0" value="0" required></div>
        </div>

        <button type="submit" class="btn-submit" id="btnSimpan"><i class="fas fa-save"></i> SIMPAN & UPDATE DASHBOARD</button>
    </form>

    <div id="notifSukses" class="alert-success">
        <i class="fas fa-check-circle"></i> Data berhasil di-update ke Dashboard Pimpinan!
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB6wb8YS-LRnDk7h5UFGTwOR26wpCtxEW4",
        authDomain: "dmj-muf.firebaseapp.com",
        projectId: "dmj-muf",
        storageBucket: "dmj-muf.firebasestorage.app",
        messagingSenderId: "151482891980",
        appId: "1:151482891980:web:2b69494a0e6ced5deecc69"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Otomatis isi tanggal hari ini saat form dimuat
    document.getElementById('tanggal').valueAsDate = new Date();

    document.getElementById('formInputAdmin').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('btnSimpan');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> MENYIMPAN...';

        const dataInput = {
            tanggal: document.getElementById('tanggal').value,
            target_amount: Number(document.getElementById('target_amount').value),
            ccar: Number(document.getElementById('ccar').value),
            ncar: Number(document.getElementById('ncar').value),
            cbsicar: Number(document.getElementById('cbsicar').value),
            nmcy: Number(document.getElementById('nmcy').value),
            mcar: Number(document.getElementById('mcar').value),
            lainnya: Number(document.getElementById('lainnya').value),
            captive: Number(document.getElementById('captive').value),
            walr: Number(document.getElementById('walr').value),
            pofde: Number(document.getElementById('pofde').value),
            ia: Number(document.getElementById('ia').value),
            last_update: new Date().toISOString()
        };

        try {
            await setDoc(doc(db, "regional_data", "sumbagut"), dataInput);
            
            document.getElementById('notifSukses').style.display = 'block';
            btn.innerHTML = '<i class="fas fa-save"></i> SIMPAN & UPDATE DASHBOARD';
            setTimeout(() => { document.getElementById('notifSukses').style.display = 'none'; }, 3000);
        } catch (error) {
            console.error("Error Firebase:", error);
            alert("Gagal menyimpan data. Pastikan koneksi internet stabil.");
            btn.innerHTML = '<i class="fas fa-save"></i> SIMPAN & UPDATE DASHBOARD';
        }
    });
</script>

</body>
</html>
