<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Input Data - DMJ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: Arial, Helvetica, sans-serif; 
            background-color: #f3f4f6; 
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* HEADER */
        .header {
            background-color: #0a1d56;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .header img {
            max-height: 40px;
            background-color: white;
            padding: 2px 5px;
            border-radius: 4px;
        }
        .header-title {
            text-align: right;
        }
        .header-title h1 { font-size: 1.1rem; font-weight: 800; color: #f59e0b; }
        .header-title p { font-size: 0.75rem; }

        /* CONTAINER FORM */
        .container {
            flex: 1;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .card {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            border-top: 4px solid #0a1d56;
        }
        .card-title {
            font-size: 1rem;
            font-weight: bold;
            color: #0a1d56;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 2px solid #f3f4f6;
            padding-bottom: 10px;
        }

        /* FORM ELEMENTS */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
        }

        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 0.85rem; font-weight: bold; color: #555; }
        
        .form-control {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s;
        }
        .form-control:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }

        /* BUTTONS & ALERT */
        .btn-save {
            background-color: #16a34a;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background-color 0.3s;
        }
        .btn-save:hover { background-color: #15803d; }
        .btn-save:disabled { background-color: #9ca3af; cursor: not-allowed; }

        .alert {
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            text-align: center;
            display: none;
        }
        .alert.success { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; display: block; }
        .alert.error { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; display: block; }

        /* FOOTER */
        .footer {
            background-color: #0a1d56;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-top: auto;
        }
        
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
            font-weight: bold; color: #0a1d56; flex-direction: column; gap: 10px;
        }
    </style>
</head>
<body>

    <!-- LOADING OVERLAY -->
    <div id="loading" class="loading-overlay">
        <i class="fas fa-spinner fa-spin fa-2x"></i>
        <span>Menarik Data dari Database...</span>
    </div>

    <!-- HEADER -->
    <div class="header">
        <img src="logo.png" alt="Logo MUF">
        <div class="header-title">
            <h1>PANEL INPUT DATA</h1>
            <p>Cabang Banda Aceh</p>
        </div>
    </div>

    <!-- MAIN CONTAINER -->
    <div class="container">
        <div id="alert-box" class="alert"></div>

        <form id="dataForm">
            <!-- PENGATURAN UMUM -->
            <div class="card">
                <div class="card-title"><i class="fas fa-sliders-h"></i> Pengaturan Utama</div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Tanggal & Periode Target</label>
                        <input type="date" id="tanggal" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Target Amount (Satuan Asli)</label>
                        <!-- type="number" dan inputmode="numeric" memastikan HP hanya menampilkan keyboard angka -->
                        <input type="number" id="target_amount" class="form-control" inputmode="numeric" placeholder="Contoh: 25889" required>
                    </div>
                </div>
            </div>

            <!-- PORTOFOLIO BOOKING -->
            <div class="card">
                <div class="card-title"><i class="fas fa-car"></i> Data Booking Portofolio</div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>CCAR</label>
                        <input type="number" id="ccar" class="form-control" inputmode="numeric" placeholder="0" required>
                    </div>
                    <div class="form-group">
                        <label>NCAR</label>
                        <input type="number" id="ncar" class="form-control" inputmode="numeric" placeholder="0" required>
                    </div>
                    <div class="form-group">
                        <label>CBSICAR</label>
                        <input type="number" id="cbsicar" class="form-control" inputmode="numeric" placeholder="0" required>
                    </div>
                    <div class="form-group">
                        <label>NMCY</label>
                        <input type="number" id="nmcy" class="form-control" inputmode="numeric" placeholder="0" required>
                    </div>
                    <div class="form-group">
                        <label>MCAR</label>
                        <input type="number" id="mcar" class="form-control" inputmode="numeric" placeholder="0" required>
                    </div>
                    <div class="form-group">
                        <label>Lainnya</label>
                        <input type="number" id="lainnya" class="form-control" inputmode="numeric" placeholder="0" required>
                    </div>
                </div>
            </div>

            <!-- INDIKATOR LAINNYA -->
            <div class="card">
                <div class="card-title"><i class="fas fa-chart-line"></i> Indikator Performa</div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>PO + FDE</label>
                        <input type="number" id="pofde" class="form-control" inputmode="numeric" placeholder="0" required>
                    </div>
                    <div class="form-group">
                        <label>IA</label>
                        <input type="number" id="ia" class="form-control" inputmode="numeric" placeholder="0" required>
                    </div>
                    <div class="form-group">
                        <label>Captive Rate (%)</label>
                        <!-- inputmode="decimal" dan step="0.01" untuk angka desimal -->
                        <input type="number" id="captive" class="form-control" inputmode="decimal" step="0.01" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label>WALR (%)</label>
                        <input type="number" id="walr" class="form-control" inputmode="decimal" step="0.01" placeholder="0.00" required>
                    </div>
                </div>
            </div>

            <button type="submit" id="btn-submit" class="btn-save">
                <i class="fas fa-save"></i> UPDATE DATA KE DASHBOARD
            </button>
        </form>
    </div>

    <!-- FOOTER COPYRIGHT -->
    <div class="footer">
        Versi 1.0 | Copyright &copy; SRISP x DMJ 2026
    </div>

    <!-- FIREBASE SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB6wb8YS-LRnDk7h5UFGTwOR26wpCtxEW4",
            authDomain: "dmj-muf.firebaseapp.com",
            projectId: "dmj-muf",
            storageBucket: "dmj-muf.firebasestorage.app",
            messagingSenderId: "151482891980",
            appId: "1:151482891980:web:2b69494a0e6ced5deecc69"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const docRef = doc(db, "regional_data", "sumbagut");

        // Fungsi menampilkan notifikasi
        function showAlert(message, type) {
            const alertBox = document.getElementById('alert-box');
            alertBox.className = `alert ${type}`;
            alertBox.innerHTML = message;
            setTimeout(() => { alertBox.className = 'alert'; }, 4000);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Ambil data yang sudah ada di database untuk mengisi form awal
        async function loadData() {
            try {
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    document.getElementById('tanggal').value = data.tanggal || "";
                    document.getElementById('target_amount').value = data.target_amount || 0;
                    document.getElementById('ccar').value = data.ccar || 0;
                    document.getElementById('ncar').value = data.ncar || 0;
                    document.getElementById('cbsicar').value = data.cbsicar || 0;
                    document.getElementById('nmcy').value = data.nmcy || 0;
                    document.getElementById('mcar').value = data.mcar || 0;
                    document.getElementById('lainnya').value = data.lainnya || 0;
                    document.getElementById('pofde').value = data.pofde || 0;
                    document.getElementById('ia').value = data.ia || 0;
                    document.getElementById('captive').value = data.captive || 0;
                    document.getElementById('walr').value = data.walr || 0;
                }
            } catch (error) {
                console.error("Error mengambil data:", error);
                showAlert("Gagal mengambil data dari server.", "error");
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        // Simpan data ketika form disubmit
        document.getElementById('dataForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Mencegah reload halaman
            
            const btnSubmit = document.getElementById('btn-submit');
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin"></i> MENYIMPAN...';

            // Mengambil nilai dan mengubah string jadi tipe angka (Number)
            const updatedData = {
                tanggal: document.getElementById('tanggal').value,
                target_amount: Number(document.getElementById('target_amount').value),
                ccar: Number(document.getElementById('ccar').value),
                ncar: Number(document.getElementById('ncar').value),
                cbsicar: Number(document.getElementById('cbsicar').value),
                nmcy: Number(document.getElementById('nmcy').value),
                mcar: Number(document.getElementById('mcar').value),
                lainnya: Number(document.getElementById('lainnya').value),
                pofde: Number(document.getElementById('pofde').value),
                ia: Number(document.getElementById('ia').value),
                captive: parseFloat(document.getElementById('captive').value),
                walr: parseFloat(document.getElementById('walr').value),
                last_update: new Date().toISOString() // Simpan jejak waktu kapan terakhir diubah
            };

            try {
                // Update ke Firebase
                await updateDoc(docRef, updatedData);
                showAlert('<i class="fas fa-check-circle"></i> Data berhasil diperbarui ke Dashboard!', 'success');
            } catch (error) {
                console.error("Error update data:", error);
                showAlert('<i class="fas fa-times-circle"></i> Gagal menyimpan data.', 'error');
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '<i class="fas fa-save"></i> UPDATE DATA KE DASHBOARD';
            }
        });

        // Load data saat halaman pertama kali dibuka
        window.onload = loadData;
    </script>
</body>
</html>
